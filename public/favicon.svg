<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="gc" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#d4aaff"/>
      <stop offset="35%"  stop-color="#9d5fff"/>
      <stop offset="100%" stop-color="#3b0d8a"/>
    </radialGradient>
    <radialGradient id="gn" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#b78bff"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0d8a"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-sm" x="-100%" y="-100%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Edges -->
  <line x1="24" y1="24" x2="24" y2="8"  stroke="#6d28d9" stroke-width="1.2" opacity="0.55"/>
  <line x1="24" y1="24" x2="10" y2="14" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
  <line x1="24" y1="24" x2="38" y2="14" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
  <line x1="24" y1="24" x2="10" y2="36" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
  <line x1="24" y1="24" x2="38" y2="36" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
  <line x1="10" y1="14" x2="38" y2="14" stroke="#6d28d9" stroke-width="0.8" opacity="0.25"/>
  <line x1="10" y1="36" x2="38" y2="36" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>

  <!-- Back nodes (dim) -->
  <circle cx="24" cy="8"  r="2.8" fill="url(#gn)" filter="url(#glow-sm)" opacity="0.7"/>
  <circle cx="10" cy="14" r="2.4" fill="url(#gn)" filter="url(#glow-sm)" opacity="0.65"/>
  <circle cx="38" cy="14" r="2.4" fill="url(#gn)" filter="url(#glow-sm)" opacity="0.65"/>

  <!-- Front nodes (bright) -->
  <circle cx="10" cy="36" r="3"   fill="url(#gn)" filter="url(#glow-sm)"/>
  <circle cx="38" cy="36" r="3"   fill="url(#gn)" filter="url(#glow-sm)"/>

  <!-- Center node (glowing) -->
  <circle cx="24" cy="24" r="5.5" fill="url(#gc)" filter="url(#glow)"/>
</svg>
