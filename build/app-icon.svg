<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep dark background -->
    <radialGradient id="bg" cx="40%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1a0b38"/>
      <stop offset="100%" stop-color="#05020e"/>
    </radialGradient>

    <!-- Center sphere — lit from upper-left -->
    <radialGradient id="gc" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#d4aaff"/>
      <stop offset="30%"  stop-color="#9d5fff"/>
      <stop offset="70%"  stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0d8a"/>
    </radialGradient>

    <!-- Front nodes — bright -->
    <radialGradient id="gf" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#b78bff"/>
      <stop offset="45%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0d8a"/>
    </radialGradient>

    <!-- Back nodes — dim, receding -->
    <radialGradient id="gb" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#7c4acd"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <!-- Glow: center -->
    <filter id="glow-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glow: front nodes -->
    <filter id="glow-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────── -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle star-field feel: a few tiny dots -->
  <circle cx="80"  cy="60"  r="1.2" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="430" cy="85"  r="1.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="460" cy="200" r="1"   fill="#7c3aed" opacity="0.5"/>
  <circle cx="50"  cy="310" r="1.3" fill="#6d28d9" opacity="0.4"/>
  <circle cx="400" cy="440" r="1.5" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="70"  cy="420" r="1"   fill="#a78bfa" opacity="0.3"/>
  <circle cx="480" cy="380" r="1.2" fill="#7c3aed" opacity="0.4"/>

  <!-- ══ LAYER 1 — Back edges (center → back nodes) ══════════════ -->
  <!-- center → back-top (260, 80) -->
  <line x1="256" y1="256" x2="260" y2="80"
        stroke="#6d28d9" stroke-width="2" opacity="0.45"/>
  <!-- center → back-top-left (148, 138) -->
  <line x1="256" y1="256" x2="148" y2="138"
        stroke="#6d28d9" stroke-width="2" opacity="0.4"/>
  <!-- center → back-top-right (358, 124) -->
  <line x1="256" y1="256" x2="358" y2="124"
        stroke="#6d28d9" stroke-width="2" opacity="0.4"/>

  <!-- back node cross-connections (faint web) -->
  <line x1="260" y1="80" x2="148" y2="138"
        stroke="#6d28d9" stroke-width="1.5" opacity="0.25"/>
  <line x1="260" y1="80" x2="358" y2="124"
        stroke="#6d28d9" stroke-width="1.5" opacity="0.25"/>
  <line x1="148" y1="138" x2="358" y2="124"
        stroke="#6d28d9" stroke-width="1.2" opacity="0.2"/>

  <!-- ══ LAYER 2 — Back nodes ════════════════════════════════════ -->
  <!-- back-top (furthest, smallest) -->
  <circle cx="260" cy="80" r="16" fill="url(#gb)" opacity="0.72"/>
  <ellipse cx="254" cy="74" rx="5.5" ry="3.5" fill="white" opacity="0.12"
           transform="rotate(-20 254 74)"/>

  <!-- back-top-left -->
  <circle cx="148" cy="138" r="17.5" fill="url(#gb)" opacity="0.76"/>
  <ellipse cx="142" cy="132" rx="6" ry="4" fill="white" opacity="0.13"
           transform="rotate(-20 142 132)"/>

  <!-- back-top-right -->
  <circle cx="358" cy="124" r="19" fill="url(#gb)" opacity="0.76"/>
  <ellipse cx="352" cy="118" rx="6.5" ry="4" fill="white" opacity="0.13"
           transform="rotate(-20 352 118)"/>

  <!-- ══ LAYER 3 — Front edges (center → front nodes) ═══════════ -->
  <!-- center → front-right (388, 340) -->
  <line x1="256" y1="256" x2="388" y2="340"
        stroke="#a78bfa" stroke-width="2.5" opacity="0.6"/>
  <!-- center → front-left (118, 360) -->
  <line x1="256" y1="256" x2="118" y2="360"
        stroke="#a78bfa" stroke-width="2.5" opacity="0.6"/>
  <!-- center → front-bottom (252, 430) -->
  <line x1="256" y1="256" x2="252" y2="430"
        stroke="#a78bfa" stroke-width="2" opacity="0.45"/>

  <!-- front cross-connections -->
  <line x1="388" y1="340" x2="252" y2="430"
        stroke="#8b5cf6" stroke-width="1.8" opacity="0.35"/>
  <line x1="118" y1="360" x2="252" y2="430"
        stroke="#8b5cf6" stroke-width="1.8" opacity="0.35"/>
  <line x1="118" y1="360" x2="388" y2="340"
        stroke="#8b5cf6" stroke-width="1.5" opacity="0.28"/>

  <!-- diagonal back↔front (sense of depth) -->
  <line x1="358" y1="124" x2="388" y2="340"
        stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
  <line x1="148" y1="138" x2="118" y2="360"
        stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>

  <!-- ══ LAYER 4 — Center glow halo ════════════════════════════ -->
  <circle cx="256" cy="256" r="58" fill="#863bff" opacity="0.18"
          filter="url(#glow-lg)"/>

  <!-- ══ LAYER 5 — Center node ═════════════════════════════════ -->
  <circle cx="256" cy="256" r="48" fill="url(#gc)" filter="url(#shadow)"/>
  <!-- specular highlight: main -->
  <ellipse cx="238" cy="236" rx="16" ry="11" fill="white" opacity="0.28"
           transform="rotate(-25 238 236)"/>
  <!-- specular: tiny secondary -->
  <ellipse cx="252" cy="228" rx="6" ry="4" fill="white" opacity="0.14"
           transform="rotate(-30 252 228)"/>
  <!-- subtle rim light on the "dark" side -->
  <circle cx="256" cy="256" r="48" fill="none"
          stroke="#a78bfa" stroke-width="1.2" opacity="0.3"/>

  <!-- ══ LAYER 6 — Front nodes (on top of center) ════════════ -->
  <!-- front-right (largest, closest) -->
  <circle cx="388" cy="340" r="27" fill="url(#gf)"
          filter="url(#glow-sm)"/>
  <ellipse cx="379" cy="332" rx="9" ry="6" fill="white" opacity="0.22"
           transform="rotate(-20 379 332)"/>

  <!-- front-left -->
  <circle cx="118" cy="360" r="24" fill="url(#gf)"
          filter="url(#glow-sm)"/>
  <ellipse cx="110" cy="352" rx="8" ry="5.5" fill="white" opacity="0.22"
           transform="rotate(-20 110 352)"/>

  <!-- front-bottom (slightly smaller) -->
  <circle cx="252" cy="430" r="21" fill="url(#gf)"
          filter="url(#glow-sm)"/>
  <ellipse cx="244" cy="422" rx="7" ry="5" fill="white" opacity="0.22"
           transform="rotate(-20 244 422)"/>
</svg>
